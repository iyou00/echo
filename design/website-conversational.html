<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Echo · 私人的音乐伙伴</title>
<style>
:root {
  --ayin-900: #27500A;
  --ayin-800: #27500A;
  --ayin-700: #3B6D11;
  --ayin-600: #639922;
  --ayin-400: #8FBC57;
  --ayin-300: #C0DD97;
  --ayin-100: #EAF3DE;
  --ayin-50: #F5FAED;
  --ink: #1A1A1A;
  --ink-soft: #5C5C5A;
  --ink-faint: #999996;
  --paper: #FFFDF7;
  --paper-warm: #F7F7F5;
  --desk: #EDEDE8;
  --serif: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Courier New", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.7;
  background:
    radial-gradient(circle at 18% 22%, rgba(192,221,151,0.30), transparent 31%),
    radial-gradient(circle at 82% 18%, rgba(255,255,255,0.68), transparent 28%),
    linear-gradient(135deg, #E8EDE2 0%, #F7F8F0 46%, #E9EEE2 100%);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

#ambient {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.stage {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 48px;
  align-items: center;
  padding: 32px 48px;
  perspective: 1200px;
}

.left-col {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  max-width: 380px;
  margin-left: auto;
}

.hero-title {
  opacity: 0;
  transform: translateY(10px);
  animation: riseIn 0.8s ease 0.2s forwards;
  text-align: right;
}

.hero-title h1 {
  margin: 0;
  color: var(--ayin-900);
  font-family: var(--serif);
  font-size: clamp(28px, 3.5vw, 42px);
  font-weight: 500;
  line-height: 1.2;
}

.hero-title .subtitle {
  margin-top: 10px;
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3.4px;
}

.hero-copy {
  margin-top: 18px;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 2;
  text-align: right;
  opacity: 0;
  animation: riseIn 0.8s ease 0.5s forwards;
}

.cta-block {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.cta-block.visible {
  opacity: 1;
  transform: translateY(0);
}

.cta-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 999px;
  padding: 0 24px;
  color: #FFFFFF;
  background: var(--ayin-600);
  box-shadow: 0 14px 28px rgba(99,153,34,0.24);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  transition: transform 180ms ease, box-shadow 180ms ease;
  cursor: pointer;
  margin-left: auto;
}

.cta-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 18px 34px rgba(99,153,34,0.28);
}

.cta-meta {
  margin-top: 10px;
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  text-align: right;
}

.window-wrap {
  position: relative;
  transform-style: preserve-3d;
  transition: transform 160ms ease-out;
}

.echo-window {
  width: 420px;
  height: calc(100vh - 64px);
  min-height: 480px;
  max-height: 700px;
  border: 0.5px solid rgba(39,80,10,0.13);
  border-radius: 14px;
  background: #FFFFFF;
  box-shadow:
    0 44px 110px rgba(45,62,31,0.18),
    0 14px 34px rgba(45,62,31,0.08),
    inset 0 0 0 1px rgba(255,255,255,0.52);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.window-header {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 50px;
  padding: 0 14px;
  background: var(--ayin-50);
  border-bottom: 0.5px solid rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.window-logo {
  position: relative;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #1F1D1D;
  flex-shrink: 0;
}

.window-logo::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  width: 8px;
  height: 8px;
  border: 2px solid var(--ayin-50);
  border-radius: 50%;
  background: var(--ayin-600);
  animation: breathe-dot 2s ease-in-out infinite;
}

.window-tabs {
  display: flex;
  justify-content: center;
  flex: 1;
  gap: 22px;
  color: var(--ink-faint);
  font-size: 12px;
}

.window-tab {
  position: relative;
  padding: 2px 0;
  cursor: default;
}

.window-tab.active {
  color: var(--ayin-700);
}

.window-tab.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 15px;
  height: 1.5px;
  border-radius: 2px;
  background: var(--ayin-600);
  transform: translateX(-50%);
}

.window-ctrls {
  display: flex;
  gap: 6px;
}

.window-ctrls span {
  width: 21px;
  height: 21px;
  border: 0.5px solid rgba(99,153,34,0.32);
  border-radius: 50%;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 6px;
  background: linear-gradient(180deg, #FFFFFF, #FAFBF7);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-area::-webkit-scrollbar { width: 0; }

.bubble {
  max-width: 330px;
  border-radius: 16px;
  padding: 11px 14px;
  font-size: 13px;
  line-height: 1.85;
  opacity: 0;
  transform: translateY(8px);
  animation: bubbleIn 0.5s ease forwards;
}

.bubble.echo {
  align-self: flex-start;
  background: #FFFFFF;
  box-shadow: 0 4px 18px rgba(0,0,0,0.04);
  border-top-left-radius: 5px;
}

.bubble.user {
  align-self: flex-end;
  background: var(--ayin-100);
  border-top-right-radius: 5px;
}

.track-card {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 10px;
  align-items: center;
  margin-top: 10px;
  border: 0.5px solid rgba(99,153,34,0.22);
  border-radius: 11px;
  padding: 11px;
  background: rgba(245,250,237,0.54);
  opacity: 0;
  transform: translateY(6px);
  animation: bubbleIn 0.4s ease forwards;
  animation-delay: 0.2s;
}

.play-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #FFFFFF;
  background: var(--ayin-600);
  cursor: pointer;
  border: none;
  transition: transform 0.15s ease;
}

.play-btn:hover { transform: scale(1.08); }

.play-btn::before {
  content: "";
  width: 0;
  height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-left: 9px solid #FFFFFF;
  margin-left: 2px;
}

.play-btn.playing::before {
  border: none;
  width: 3px;
  height: 10px;
  border-left: 3px solid #FFFFFF;
  border-right: 3px solid #FFFFFF;
  margin-left: 0;
}

.track-info { min-width: 0; }

.track-title {
  font-weight: 600;
  font-size: 13px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-meta {
  margin-top: 2px;
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.5px;
}

.track-time {
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 10px;
  align-self: center;
}

.track-wave {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 2.5px;
  height: 20px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.track-wave.active { opacity: 1; }

.track-wave span {
  width: 2.5px;
  border-radius: 4px;
  background: var(--ayin-300);
  animation: none;
}

.track-wave.active span {
  animation: wave 1.25s ease-in-out infinite;
}

.track-wave span:nth-child(3n) { background: var(--ayin-600); }
.track-wave span:nth-child(2n) { animation-delay: 120ms; }
.track-wave span:nth-child(4n) { animation-delay: 260ms; }

.input-area {
  flex-shrink: 0;
  padding: 10px 12px 12px;
  background: rgba(255,255,255,0.92);
  border-top: 0.5px solid rgba(0,0,0,0.06);
  backdrop-filter: blur(18px);
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0.5px solid rgba(0,0,0,0.08);
  border-radius: 999px;
  padding: 0 6px 0 16px;
  background: #FFFFFF;
  transition: border-color 0.2s ease;
}

.input-wrap:focus-within {
  border-color: var(--ayin-600);
}

.input-wrap input {
  flex: 1;
  height: 36px;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
}

.input-wrap input::placeholder {
  color: var(--ink-faint);
}

.send-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--ayin-600);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, opacity 0.15s ease;
  opacity: 0.5;
}

.send-btn.ready { opacity: 1; }
.send-btn:hover { transform: scale(1.06); }

.send-btn svg {
  width: 14px;
  height: 14px;
  fill: #FFFFFF;
}

.player-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px 13px;
  background: rgba(255,255,255,0.92);
  border-top: 0.5px solid rgba(0,0,0,0.06);
  backdrop-filter: blur(18px);
}

.player-wave {
  display: flex;
  align-items: center;
  gap: 2.5px;
  height: 24px;
  flex: 1;
}

.player-wave span {
  width: 2.5px;
  border-radius: 4px;
  background: var(--ayin-300);
  animation: none;
}

.player-wave.active span {
  animation: wave 1.25s ease-in-out infinite;
}

.player-wave.active span:nth-child(3n) { background: var(--ayin-600); }
.player-wave.active span:nth-child(2n) { animation-delay: 120ms; }
.player-wave.active span:nth-child(4n) { animation-delay: 260ms; }

.player-info {
  min-width: 0;
  flex: 1;
}

.player-title {
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-artist {
  color: var(--ink-faint);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.5px;
}

.mini-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mini-circle {
  width: 24px;
  height: 24px;
  border: 0.5px solid rgba(0,0,0,0.08);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-faint);
  font-size: 13px;
  cursor: default;
}

.mini-play {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--ayin-600);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.mini-play::before {
  content: "";
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 7px solid #FFFFFF;
  margin-left: 2px;
}

.mini-play.playing::before {
  width: 3px;
  height: 9px;
  border-left: 3px solid #FFFFFF;
  border-right: 3px solid #FFFFFF;
  border-top: none;
  border-bottom: none;
  margin-left: 0;
}

.corner-note {
  position: absolute;
  right: -60px;
  top: 50%;
  transform: rotate(-7deg) translateY(-50%);
  width: 150px;
  border: 0.5px solid rgba(39,80,10,0.12);
  border-radius: 14px;
  padding: 14px;
  background: rgba(255,255,255,0.72);
  box-shadow: 0 18px 42px rgba(42,75,21,0.10);
  backdrop-filter: blur(12px);
  z-index: 2;
}

.corner-note .k {
  margin-bottom: 6px;
  color: var(--ayin-700);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2.4px;
}

.corner-note p {
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 12px;
  line-height: 1.85;
}

.desk-mark {
  position: fixed;
  right: clamp(24px, 4vw, 62px);
  bottom: clamp(20px, 4vw, 54px);
  z-index: 1;
  color: rgba(39,80,10,0.30);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3.4px;
  writing-mode: vertical-rl;
  user-select: none;
}

@keyframes breathe-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

@keyframes bubbleIn {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes wave {
  0%, 100% { height: 24%; }
  50% { height: 88%; }
}

@keyframes riseIn {
  to { opacity: 1; transform: translateY(0); }
}

.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 11px 14px;
  background: #FFFFFF;
  box-shadow: 0 4px 18px rgba(0,0,0,0.04);
  border-radius: 16px;
  border-top-left-radius: 5px;
  align-self: flex-start;
  max-width: 56px;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ayin-300);
  animation: typingDot 1.2s ease-in-out infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingDot {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

@media (max-width: 960px) {
  .stage {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    gap: 20px;
    padding: 24px 16px;
    align-items: start;
  }

  .left-col {
    max-width: 100%;
    margin-left: 0;
    align-items: center;
    text-align: center;
  }

  .hero-title, .hero-copy { text-align: center; }

  .cta-btn { margin-left: auto; margin-right: auto; }
  .cta-meta { text-align: center; }

  .echo-window {
    width: min(420px, 100%);
    height: calc(100vh - 180px);
    max-height: none;
  }

  .corner-note, .desk-mark { display: none; }
}

@media (max-width: 480px) {
  .stage { padding: 16px 12px; gap: 14px; }

  .hero-title h1 { font-size: 24px; }
  .hero-copy { font-size: 13px; margin-top: 10px; }

  .echo-window {
    width: 100%;
    height: calc(100vh - 160px);
  }

  .window-tabs { gap: 14px; font-size: 11px; }
  .window-ctrls { display: none; }
  .bubble { max-width: 280px; }
}
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<div class="desk-mark">PRIVATE MUSIC COMPANION</div>

<main class="stage">
  <div class="left-col">
    <div class="hero-title">
      <h1>Echo 会记住<br/>你的音乐口味。</h1>
      <div class="subtitle">P R I V A T E · M U S I C · C O M P A N I O N</div>
    </div>
    <p class="hero-copy">
      它陪你聊天，按当下状态找歌，<br/>
      把每天的音乐线索写成风信。<br/>
      你多听一次，多收藏一首，它就更懂一点。
    </p>
    <div class="cta-block" id="ctaBlock">
      <a class="cta-btn" href="#">下载 Echo for Windows</a>
      <div class="cta-meta">LOCAL MEMORY · NETEASE MUSIC · OPENAI COMPATIBLE</div>
    </div>
  </div>

  <div class="window-wrap" id="windowWrap">
    <aside class="corner-note">
      <div class="k">E C H O · L O C A L · M E M O R Y</div>
      <p>从一份歌单开始，慢慢认识你的耳朵。</p>
    </aside>

    <div class="echo-window">
      <div class="window-header">
        <div class="window-logo"></div>
        <div class="window-tabs">
          <span class="window-tab active">絮语</span>
          <span class="window-tab">风信</span>
          <span class="window-tab">回声</span>
          <span class="window-tab">拾音</span>
        </div>
        <div class="window-ctrls"><span></span><span></span><span></span></div>
      </div>

      <div class="chat-area" id="chatArea"></div>

      <div class="input-area">
        <div class="input-wrap">
          <input type="text" id="userInput" placeholder="跟 Echo 说点什么..." autocomplete="off" />
          <button class="send-btn" id="sendBtn" aria-label="发送">
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>

      <div class="player-bar" id="playerBar" style="display:none;">
        <div class="player-wave" id="playerWave"></div>
        <div class="player-info">
          <div class="player-title" id="playerTitle"></div>
          <div class="player-artist" id="playerArtist"></div>
        </div>
        <div class="mini-controls">
          <span class="mini-circle">&#8249;</span>
          <span class="mini-play" id="miniPlayBtn"></span>
          <span class="mini-circle">&#8250;</span>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function() {

var songs = [
  { title: "Sunny", artist: "Boney M.", year: 1976, duration: "3:59",
    intro: "这个点适合一点明亮但不吵的歌。我给你放一首，先把脑子从白天里拎出来。",
    after: "先听半分钟就知道对不对了。" },
  { title: "一格格", artist: "陈奕迅", year: 2003, duration: "4:12",
    intro: "这首老派的粤语歌，适合安静的时候慢慢听。",
    after: "旋律会慢慢住进你耳朵里。" },
  { title: "Cold", artist: "Portishead", year: 1994, duration: "4:28",
    intro: "有点冷清的歌，但不是寂寞的那种冷。",
    after: "这种声音需要一点耐心，但不亏。" },
  { title: "Vincent", artist: "Don McLean", year: 1971, duration: "3:55",
    intro: "晚上特别适合这首，像在听一个人说故事。",
    after: "这歌不长，但够把一天的尾巴收好。" },
  { title: "海阔天空", artist: "Beyond", year: 1993, duration: "5:25",
    intro: "偶尔需要一首能撑住场子的。这首不算吵，但很稳。",
    after: "这首歌不需要理由，听就是了。" },
  { title: "California Dreamin'", artist: "The Mamas & The Papas", year: 1965, duration: "2:42",
    intro: "一首很短的老歌，但它的阳光是真的。",
    after: "两分半就结束了，你会想再放一遍。" },
  { title: "夜空中最亮的星", artist: "逃跑计划", year: 2011, duration: "4:12",
    intro: "不需要多说什么的歌。放就对了。",
    after: "有些歌就是刚好在这个时刻等你。" },
  { title: "Blue in Green", artist: "Miles Davis", year: 1959, duration: "5:27",
    intro: "这首没有歌词。但你会听到很多东西。",
    after: "爵士不太适合所有人，但试一次不吃亏。" },
  { title: "小幸运", artist: "田馥甄", year: 2015, duration: "4:36",
    intro: "有些歌你听过很多次了，但在对的时间再听一次，感觉还是不一样。",
    after: "怀旧不可耻，有时候刚好需要。" },
  { title: "Last Dance", artist: "Wham!", year: 1984, duration: "4:32",
    intro: "老派的快乐是会传染的。这首适合随便什么心情。",
    after: "节奏一上来，什么烦心事都先放放。" }
];

var moods = {
  happy: {
    match: ["开心","高兴","心情好","不错","挺好的","好开心","太好了"],
    reply: "那今天的声音可以再亮一点。",
    pick: ["Last Dance","California Dreamin'","Sunny"]
  },
  tired: {
    match: ["累","困","疲惫","不想动","好累","好困","没精神","乏"],
    reply: "知道那种感觉。来一首不用动脑子的。",
    pick: ["Blue in Green","Vincent","Cold"]
  },
  recommend: {
    match: ["推荐","来一首","放首歌","想听","给我来","听什么","放一个","来点"],
    reply: "你现在的状态，我会选这首。",
    pick: null
  },
  who: {
    match: ["你是谁","你是什么","介绍一下","echo是什么"],
    reply: "我是 Echo，住在桌面上的音乐伙伴。你听歌的时候我就在旁边，慢慢记住你喜欢什么。"
  },
  yinyi: {
    match: ["风信","日记","每天","写信","记录"],
    reply: "每天晚上我会写一段风信，把今天被音乐照到的那一小块留住。"
  },
  hello: {
    match: ["你好","嗨","hi","hello","hey","哈喽"],
    reply: "在呢。要听点什么，还是随便聊聊？"
  },
  scene: {
    match: ["工作","学习","写代码","加班","专注","开会"],
    reply: "这种时候需要一首不抢注意力的。让它待在背景里就好。",
    pick: ["Blue in Green","Cold","Vincent"]
  },
  sad: {
    match: ["难过","不开心","心情不好","伤心","郁闷","低落"],
    reply: "不用硬撑。先听一首安静的，让它陪你一会儿。",
    pick: ["Vincent","夜空中最亮的星","Blue in Green"]
  }
};

var fallbacks = [
  "这个我说不好，但我知道你现在适合听什么。",
  "嗯，我先帮你找首歌吧，边听边聊。",
  "说不太上来。要不先听首歌？"
];

var chatArea = document.getElementById('chatArea');
var userInput = document.getElementById('userInput');
var sendBtn = document.getElementById('sendBtn');
var playerBar = document.getElementById('playerBar');
var playerTitle = document.getElementById('playerTitle');
var playerArtist = document.getElementById('playerArtist');
var playerWave = document.getElementById('playerWave');
var miniPlayBtn = document.getElementById('miniPlayBtn');
var ctaBlock = document.getElementById('ctaBlock');
var isTyping = false;
var currentSong = null;
var globalPlaying = false;
var activeCardBtn = null;
var activeCardWave = null;

for (var i = 0; i < 28; i++) {
  var bar = document.createElement('span');
  var h = 30 + Math.random() * 50;
  bar.style.height = h + '%';
  playerWave.appendChild(bar);
}

function scrollChat() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function createWaveBars() {
  var bars = '';
  for (var i = 0; i < 22; i++) {
    var h = 30 + Math.random() * 55;
    bars += '<span style="height:' + h + '%"></span>';
  }
  return bars;
}

function addBubble(text, type, delay) {
  return new Promise(function(resolve) {
    setTimeout(function() {
      var div = document.createElement('div');
      div.className = 'bubble ' + type;
      chatArea.appendChild(div);
      scrollChat();

      if (type === 'echo') {
        typeText(div, text).then(resolve);
      } else {
        div.textContent = text;
        scrollChat();
        resolve();
      }
    }, delay || 0);
  });
}

function typeText(el, text) {
  return new Promise(function(resolve) {
    var i = 0;
    var speed = 45;
    function tick() {
      if (i < text.length) {
        el.textContent += text[i];
        var ch = text[i];
        i++;
        scrollChat();
        var pause = speed;
        if ('，。、！？；：…—'.indexOf(ch) >= 0) pause = speed + 180;
        else if (',.!?;:'.indexOf(ch) >= 0) pause = speed + 120;
        setTimeout(tick, pause);
      } else {
        resolve();
      }
    }
    tick();
  });
}

function setPlayState(playing) {
  globalPlaying = playing;
  if (activeCardBtn) activeCardBtn.classList.toggle('playing', playing);
  if (activeCardWave) activeCardWave.classList.toggle('active', playing);
  playerWave.classList.toggle('active', playing);
  miniPlayBtn.classList.toggle('playing', playing);
}

function addTrackCard(song, delay) {
  return new Promise(function(resolve) {
    setTimeout(function() {
      if (globalPlaying) setPlayState(false);

      var card = document.createElement('div');
      card.className = 'track-card';
      card.innerHTML =
        '<button class="play-btn" aria-label="播放"></button>' +
        '<div class="track-info">' +
          '<div class="track-title">' + song.title + '</div>' +
          '<div class="track-meta">' + song.artist + ' · ' + song.year + '</div>' +
        '</div>' +
        '<div class="track-time">' + song.duration + '</div>' +
        '<div class="track-wave">' + createWaveBars() + '</div>';
      chatArea.appendChild(card);
      scrollChat();

      currentSong = song;
      showPlayer(song);

      activeCardBtn = card.querySelector('.play-btn');
      activeCardWave = card.querySelector('.track-wave');

      activeCardBtn.addEventListener('click', function() {
        setPlayState(!globalPlaying);
      });

      resolve();
    }, delay || 0);
  });
}

function showPlayer(song) {
  playerBar.style.display = 'flex';
  playerTitle.textContent = song.title;
  playerArtist.textContent = song.artist;
}

miniPlayBtn.addEventListener('click', function() {
  if (currentSong) setPlayState(!globalPlaying);
});

function showTyping() {
  var el = document.createElement('div');
  el.className = 'typing-indicator';
  el.id = 'typingDots';
  el.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(el);
  scrollChat();
}

function hideTyping() {
  var el = document.getElementById('typingDots');
  if (el) el.remove();
}

function matchMood(text) {
  var lower = text.toLowerCase();
  for (var key in moods) {
    var patterns = moods[key].match;
    for (var i = 0; i < patterns.length; i++) {
      if (lower.indexOf(patterns[i].toLowerCase()) >= 0) return key;
    }
  }
  return null;
}

function pickSong(mood) {
  if (mood && moods[mood] && moods[mood].pick) {
    var names = moods[mood].pick;
    var name = names[Math.floor(Math.random() * names.length)];
    for (var i = 0; i < songs.length; i++) {
      if (songs[i].title === name) return songs[i];
    }
  }
  var idx = Math.floor(Math.random() * songs.length);
  return songs[idx];
}

function handleInput() {
  var text = userInput.value.trim();
  if (!text || isTyping) return;

  isTyping = true;
  userInput.value = '';
  sendBtn.classList.remove('ready');

  addBubble(text, 'user', 0).then(function() {
    showTyping();
    return new Promise(function(r) { setTimeout(r, 800 + Math.random() * 600); });
  }).then(function() {
    hideTyping();

    var mood = matchMood(text);
    if (mood) {
      var m = moods[mood];
      return addBubble(m.reply, 'echo', 0).then(function() {
        if (m.pick) {
          var song = pickSong(mood);
          return addTrackCard(song, 600);
        }
      });
    } else {
      var reply = fallbacks[Math.floor(Math.random() * fallbacks.length)];
      return addBubble(reply, 'echo', 0).then(function() {
        var song = songs[Math.floor(Math.random() * songs.length)];
        return addTrackCard(song, 600);
      });
    }
  }).then(function() {
    isTyping = false;
  });
}

sendBtn.addEventListener('click', handleInput);
userInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleInput();
});
userInput.addEventListener('input', function() {
  sendBtn.classList.toggle('ready', userInput.value.trim().length > 0);
});

var opener = songs[0];

function startIntro() {
  addBubble('嘿，你来了。', 'echo', 800)
    .then(function() {
      return new Promise(function(r) { setTimeout(r, 1200); });
    })
    .then(function() {
      return addBubble(opener.intro, 'echo', 0);
    })
    .then(function() {
      return addTrackCard(opener, 400);
    })
    .then(function() {
      return new Promise(function(r) { setTimeout(r, 800); });
    })
    .then(function() {
      return addBubble(opener.after, 'echo', 0);
    })
    .then(function() {
      ctaBlock.classList.add('visible');
    });
}

setTimeout(startIntro, 400);

var canvas = document.getElementById('ambient');
var ctx = canvas.getContext('2d');
var width = 0, height = 0, particles = [];

function resize() {
  var ratio = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.floor(width * ratio);
  canvas.height = Math.floor(height * ratio);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  particles = [];
  var count = Math.min(70, Math.floor(width / 18));
  for (var i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: 0.4 + Math.random() * 1.4,
      a: 0.06 + Math.random() * 0.14,
      vx: -0.06 + Math.random() * 0.12,
      vy: -0.02 + Math.random() * 0.06,
      phase: i * 0.37
    });
  }
}

function draw(time) {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx + Math.sin(time / 2200 + p.phase) * 0.03;
    p.y += p.vy;
    if (p.x < -8) p.x = width + 8;
    if (p.x > width + 8) p.x = -8;
    if (p.y < -8) p.y = height + 8;
    if (p.y > height + 8) p.y = -8;
    ctx.beginPath();
    ctx.fillStyle = 'rgba(39,80,10,' + p.a + ')';
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);

var windowWrap = document.getElementById('windowWrap');
var isMobile = window.innerWidth <= 960;

if (!isMobile) {
  document.addEventListener('mousemove', function(e) {
    var x = (e.clientX / window.innerWidth - 0.5) * 2;
    var y = (e.clientY / window.innerHeight - 0.5) * 2;
    windowWrap.style.transform = 'rotateY(' + (x * 2.5) + 'deg) rotateX(' + (-y * 1.8) + 'deg) translateY(' + (y * 2) + 'px)';
  });

  document.addEventListener('mouseleave', function() {
    windowWrap.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });
}

})();
</script>
</body>
</html>
