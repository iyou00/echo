<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Echo · 语音模式</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ayin-900: #27500A;
    --ayin-700: #3B6D11;
    --ayin-600: #639922;
    --ayin-400: #8FBC57;
    --ayin-300: #C0DD97;
    --ayin-100: #EAF3DE;
    --bg: #FFFFFF;
    --bg-2: #F7F7F5;
    --bg-3: #EDEDE8;
    --text: #1A1A1A;
    --text-2: #5C5C5A;
    --text-3: #999996;
    --border: rgba(0,0,0,0.08);

    --sans: "Noto Sans SC", -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", monospace;
    --serif: "Noto Serif SC", Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg-3);
    font-family: var(--sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse at top, rgba(143, 188, 87, 0.1), transparent 50%),
      var(--bg-3);
  }
  .app {
    width: 440px;
    height: 720px;
    background: var(--bg);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0, 40, 0, 0.12), 0 4px 12px rgba(0, 40, 0, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* 语音卡片 · 占据大部分空间 */
  .voice-sheet {
    flex: 1;
    background:
      radial-gradient(circle at 30% 20%, rgba(143, 188, 87, 0.35), transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(99, 153, 34, 0.15), transparent 50%),
      var(--ayin-100);
    padding: 32px 30px 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* 装饰纹理(细微噪点) */
  .voice-sheet::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(99, 153, 34, 0.12) 0.5px, transparent 0);
    background-size: 16px 16px;
    opacity: 0.4;
    pointer-events: none;
  }

  .voice-hdr {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }
  .voice-av {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--ayin-600);
    color: var(--ayin-100);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    font-size: 14px;
  }
  .voice-status {
    flex: 1;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--ayin-700);
  }
  .voice-time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ayin-700);
    letter-spacing: 0.5px;
  }

  /* 文字区 · 三段式 */
  .voice-text {
    font-size: 18px;
    line-height: 1.95;
    color: var(--ayin-900);
    font-family: var(--serif);
    margin-bottom: 28px;
    flex: 1;
    position: relative;
    z-index: 1;
    letter-spacing: 0.3px;
  }
  .voice-text .said {
    color: var(--ayin-900);
  }
  .voice-text .now {
    color: var(--ayin-600);
    font-weight: 500;
    position: relative;
  }
  .voice-text .now::after {
    content: '';
    display: inline-block;
    width: 3px;
    height: 18px;
    background: var(--ayin-600);
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 0.8s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .voice-text .pending {
    opacity: 0.22;
    color: var(--ayin-900);
  }

  /* 中央大音浪 */
  .big-wave {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 48px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }
  .big-wave span {
    width: 3px;
    background: var(--ayin-600);
    border-radius: 2.5px;
    animation: bigWave 1.1s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes bigWave {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }

  /* 底部 · 状态 + 退出 */
  .voice-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .voice-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ayin-700);
    letter-spacing: 1.5px;
  }
  .exit-btn {
    font-family: var(--mono);
    font-size: 10px;
    padding: 8px 16px;
    background: transparent;
    border: 0.5px solid var(--ayin-600);
    color: var(--ayin-700);
    border-radius: 20px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
  }
  .exit-btn:hover {
    background: var(--ayin-600);
    color: var(--ayin-100);
  }

  /* 底部小播放器依然保留 */
  .player-mini {
    padding: 12px 18px;
    border-top: 0.5px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .player-mini .pb-title {
    font-weight: 500;
    font-size: 13px;
    flex: 1;
  }
  .player-mini .pb-title small {
    color: var(--text-2);
    font-weight: 400;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.3px;
    margin-left: 6px;
  }
  .mini-ctrl {
    display: flex;
    gap: 6px;
  }
  .mini-btn {
    width: 24px;
    height: 24px;
    border: 0.5px solid var(--border);
    background: transparent;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="app">

    <div class="voice-sheet">
      <div class="voice-hdr">
        <div class="voice-av">E</div>
        <div class="voice-status">E C H O · S P E A K I N G</div>
        <div class="voice-time">00:06 / 00:18</div>
      </div>

      <div class="voice-text">
        <span class="said">14 点 22 分,我给你挑了一首海洋Bo 的《向云端》——慢节奏的,</span><span class="now">让你的眼皮</span><span class="pending">轻一点。这首是 2023 年那波治愈系流行里写得最稳的一首。</span>
      </div>

      <div class="big-wave" id="bigWave"></div>

      <div class="voice-foot">
        <span class="voice-label">场景化语音</span>
        <button class="exit-btn">回 聊</button>
      </div>
    </div>

    <!-- 退到底部的 mini 播放器 -->
    <div class="player-mini">
      <div class="pb-title">
        向云端 <small>海洋Bo</small>
      </div>
      <div class="mini-ctrl">
        <button class="mini-btn">◁</button>
        <button class="mini-btn">❚❚</button>
        <button class="mini-btn">▷</button>
      </div>
    </div>

  </div>
</div>

<script>
  // 大音浪 · 居中
  (function() {
    const w = document.getElementById('bigWave');
    const n = 23;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      // 中心高,两端矮,做成菱形
      const mid = (n - 1) / 2;
      const dist = Math.abs(i - mid) / mid;
      const baseH = 60 - dist * 45;
      s.style.height = baseH + '%';
      s.style.animationDelay = (Math.abs(i - mid) * 0.07) + 's';
      s.style.animationDuration = (0.9 + Math.random() * 0.5) + 's';
      w.appendChild(s);
    }
  })();
</script>

</body>
</html>
